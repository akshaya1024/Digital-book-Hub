
     {% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Book Management {% endblock %}</title>
    <link rel="stylesheet" href="{% static 'library_information/mainpage.css' %}">
</head>
<body>
    
        <div class="header-div">
            <img  src="{% static 'images/image.png' %} " alt="Book image" >
            <h1>Digital Book Hub</h1>
        </div>
           
    

    <main class="content">
        {% block content %} 
           
                <marquee>Welcome to the Book Management</marquee><br>
                <h2 style="margin-left: 120px;"> Book Management  </h2>
                <button><a href="{% url 'view_books' %}">View Book</a></button><br>
                <button><a href="{% url 'add_book' %}">Add Books</a></button><br>
                <button><a href="{% url 'update_books' %}">Update Books</a></button><br>
                <button><a href="{% url 'delete_books' %}">Delete Books</a></button>
                

           
        {% endblock %}
    </main>
</body>
</html>
