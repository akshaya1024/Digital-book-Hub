{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - Digital Book Hub</title>

    <link rel="stylesheet"
          href="{% static 'library_information/add_book.css' %}">
</head>
<body>

    <header class="header-div">
        <img src="{% static 'images/image.png' %}" alt="Book image">
        <h1>Digital Book Hub</h1>
    </header>

    <main class="content">

        <div class="form-container">
            <h2>Edit Student Information</h2>

            <form method="POST">
                {% csrf_token %}

                <label for="Student_name">Student Name</label>
                <input
                    type="text"
                    id="Student_name"
                    name="Student_name"
                    value="{{ student.Student_name }}"
                    required
                >

                <label for="Email"> Email</label>
                <input
                    type="email"
                    id="Email"
                    name="Email"
                    value="{{ student.Email }}"
                    required
                >

                <label for="PhoneNo">Phone No</label>
                <input
                    type="tel"
                    id="PhoneNo"
                    name="PhoneNo"
                    value="{{ student.PhoneNo}}"                
                    maxlength="10"
                    required
                >
                
                <label for="Department">Department</label>
                <input
                    type="text"
                    id="Department"
                    name="Department"
                    value="{{ student.Department }}"
                    required
                >

                <button type="submit">Update Student</button>
            </form>

            <a href="{% url 'update_student' %}" class="back-button">Cancel</a>
        </div>

    </main>

</body>
</html>
