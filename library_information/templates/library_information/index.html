
     {% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Digital Book Hub{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'library_information/mainpage.css' %}">
</head>
<body>
    
        <div class="header-div">
            <img  src="{% static 'images/image.png' %} " alt="Book image" >
            <h1>Digital Book Hub</h1>

    <main class="content">
        {% block content %} 
           
                <marquee>Welcome to the Digital Book Hub Library</marquee><br>

        {% endblock %}
    </main>
</body>
</html>
